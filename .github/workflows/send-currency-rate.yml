name: Send Currency Rate

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  send-currency-rate:
    runs-on: ubuntu-latest
    concurrency:
      group: send-currency-rate
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate email
        env:
          ALERT_THRESHOLD_PERCENT: ""   # set e.g. "1.5" to only email on big moves
        run: python currency_rate_emailer.py generate

      - name: Publish charts
        # Charts are linked into the email by URL (raw.githubusercontent.com)
        # rather than attached, so they need to be pushed before the email
        # goes out. Guarded so a run with no chart files yet (e.g. brand-new
        # fork, no history) doesn't fail the job.
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          shopt -s nullglob
          charts=(chart_*.png)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No chart images generated this run."
          else
            git add "${charts[@]}"
            if git diff --cached --quiet; then
              echo "No chart changes to commit."
            else
              git commit -m "Update rate charts [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CURRENCY_RECIPIENT: ${{ secrets.CURRENCY_RECIPIENT }}
        run: python currency_rate_emailer.py send

      - name: Commit updated rate cache and history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_rates.json rate_history.csv
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update rate cache and history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
