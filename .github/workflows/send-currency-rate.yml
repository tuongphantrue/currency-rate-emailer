name: Send Currency Rate

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  send-currency-rate:
    runs-on: ubuntu-latest
    concurrency:
      group: send-currency-rate
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate email
        env:
          ALERT_THRESHOLD_PERCENT: ""   # set e.g. "1.5" to only email on big moves
        run: python currency_rate_emailer.py generate

      - name: Commit rate data and charts
        # Everything `generate` touched — last_rates.json, rate_history.csv,
        # chart_*.png, and docs/index.html (the interactive dashboard) — is
        # committed together, in one step, before the email is sent. Charts
        # and the dashboard link are both referenced by URL rather than
        # attached/embedded, so they need to already be live by send time.
        #
        # This has to be ONE commit covering all of it, not split into
        # "charts before send" / "rate data after send": generate() modifies
        # last_rates.json and rate_history.csv too, and if a separate,
        # earlier step committed only the charts, those two files would be
        # left as uncommitted changes in the working tree — which is exactly
        # what made `git pull --rebase` refuse to run ("You have unstaged
        # changes") in an earlier version of this step.
        #
        # continue-on-error so a git hiccup here (e.g. a rebase conflict)
        # can't prevent the email itself from sending — worst case, that
        # run's chart/dashboard links go stale until the next successful run.
        #
        # The sleep after a successful push gives raw.githubusercontent.com's
        # CDN a moment to propagate the new content globally before it's
        # referenced by URL in the email sent right after. Gmail proxies
        # external images through its own servers, and each email's chart
        # URLs are unique (cache-busted), so there's no previously-successful
        # fetch to fall back on if Gmail's proxy happens to hit an edge node
        # that hasn't caught up yet — this buffer is a low-cost hedge against
        # that specific race, not a confirmed fix for it. GitHub Pages (the
        # dashboard) has its own separate build/deploy step after this push
        # that can take longer than 30s — a link clicked moments after the
        # email arrives may briefly show the previous version, which is a
        # much smaller problem than a broken inline image, so this isn't
        # tuned specifically for that.
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          shopt -s nullglob
          git add last_rates.json rate_history.csv chart_*.png docs/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rate cache, history, charts, and dashboard [skip ci]"
            git pull --rebase origin main
            git push origin main
            sleep 30
          fi

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CURRENCY_RECIPIENT: ${{ secrets.CURRENCY_RECIPIENT }}
        run: python currency_rate_emailer.py send
